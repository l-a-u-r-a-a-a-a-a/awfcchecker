name: Update data
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - run: node scripts/news.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json news-seen.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
      - name: Email news alert (via GitHub issue)
        if: hashFiles('news-alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Slegers news alert: $(date -u '+%d %b %H:%M') UTC" --body-file news-alert.md --assignee "${{ github.repository_owner }}"
